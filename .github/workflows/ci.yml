name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Source Tk import on disposable Linux workers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libtk8.6
      - run: npm ci --ignore-scripts
      - run: npm run build
      - shell: bash
        run: bash scripts/validate.sh
  native:
    name: Native Java/C# / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.404'
      - name: Actual native cores
        shell: bash
        run: |
          mkdir -p out/java
          javac -encoding UTF-8 -Xlint:all -Werror -d out/java services/java/*.java tests/java/*.java
          java -cp out/java PolicyTests
          dotnet restore services/session/SessionLab.csproj --locked-mode
          dotnet restore tests/session/SessionTests.csproj --locked-mode
          dotnet build services/session/SessionLab.csproj -c Release --no-restore
          dotnet build tests/session/SessionTests.csproj -c Release --no-restore
          dotnet format services/session/SessionLab.csproj whitespace --verify-no-changes --no-restore
          dotnet format tests/session/SessionTests.csproj whitespace --verify-no-changes --no-restore
          dotnet tests/session/bin/Release/net10.0/SessionTests.dll
  integration:
    name: Native PHP/SQL + all four real HTTP adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.404'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Native compiler, real SQLite and owned-service regressions
        run: bash scripts/native.sh
      - name: Observed evidence summary, not artifact upload
        run: |
          cat out/java-core.json
          cat out/session-core.json
          cat out/php-core.json
  browser:
    name: Browser / Chromium, Firefox, WebKit, mobile
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: |
          mkdir -p out
          npm run typecheck
          npm run build
          npm run test:unit
      - name: Prove all three real locked browsers and missing-executable refusal
        timeout-minutes: 3
        run: node scripts/check_browser_host.mjs chromium firefox webkit
      - run: npm run test:e2e
  security:
    name: Security / dependencies, secrets, workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      - run: |
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
          npm run audit
          python scripts/scanners.py gitleaks
          python scripts/scanners.py actionlint
          .tools/gitleaks git . --redact --no-banner
          .tools/actionlint
          shellcheck scripts/validate.sh scripts/native.sh
  portable-windows:
    name: Windows / real four-runtime native application
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5'
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements-native.lock --disable-pip --no-deps
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Exact official SDK/archive and signed app-local CRT admission, complete portable build
        run: python scripts/build_native.py
      - name: Actual Tk inputs, all four native services, independent status/content/cohort oracles, export and two-process reopen
        run: python scripts/test_native_app.py
