name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, java-kotlin, csharp]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25.0.4'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.401'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ (matrix.language == 'java-kotlin' || matrix.language == 'csharp') && 'manual' || 'none' }}
      - if: matrix.language == 'java-kotlin'
        run: |
          mkdir -p out/java
          javac -encoding UTF-8 -Xlint:all -Werror -d out/java services/java/*.java tests/java/*.java
      - if: matrix.language == 'csharp'
        run: |
          dotnet restore services/session/SessionLab.csproj --locked-mode
          dotnet build services/session/SessionLab.csproj -c Release --no-restore
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          upload-database: false
