[project]
name = "application-security-regression-lab"
version = "1.0.0"
description = "Owned-loopback multi-language security regression evidence by Jason Stys"
requires-python = ">=3.12"
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = ["E501"]
[tool.mypy]
strict = true
python_version = "3.12"
files = ["asrl"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["asrl"]
[tool.coverage.report]
fail_under = 95
show_missing = true
